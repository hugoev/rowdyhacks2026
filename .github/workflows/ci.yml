name: Verify Tripwire
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
        if: runner.os == 'Linux'
      - run: npm run test:e2e
        if: runner.os == 'Linux'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results-${{ runner.os }}
          path: |
            test-results/**/*.png
            test-results/**/*.zip
            test-results/**/*.md
          retention-days: 7
