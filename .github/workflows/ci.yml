name: Verify Tripwire
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
        if: runner.os == 'Linux'
      - run: npm run test:e2e
        if: runner.os == 'Linux'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results-${{ runner.os }}
          path: |
            test-results/**/*.png
            test-results/**/*.zip
            test-results/**/*.md
          retention-days: 7
  verify-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable --no-self-update
      - run: cargo +stable test --locked --manifest-path chain/Cargo.toml
  deploy:
    needs: [verify, verify-chain]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Configure private deployment credentials
        env:
          VULTR_SSH_KEY: ${{ secrets.VULTR_SSH_KEY }}
          VULTR_KNOWN_HOSTS: ${{ secrets.VULTR_KNOWN_HOSTS }}
          VULTR_ENV: ${{ secrets.VULTR_ENV }}
          SOLANA_PROGRAM_ID: ${{ vars.SOLANA_PROGRAM_ID }}
          SOLANA_GUARDIAN_PUBLIC_KEY: ${{ vars.SOLANA_GUARDIAN_PUBLIC_KEY }}
          SOLANA_RECIPIENT_PUBLIC_KEY: ${{ vars.SOLANA_RECIPIENT_PUBLIC_KEY }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
        run: |
          test -n "$VULTR_SSH_KEY"
          test -n "$VULTR_KNOWN_HOSTS"
          test -n "$VULTR_ENV"
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$VULTR_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$VULTR_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$VULTR_ENV" > .env.vultr
          node --input-type=module -e 'import {appendFileSync} from "node:fs"; for (const key of ["SOLANA_PROGRAM_ID", "SOLANA_GUARDIAN_PUBLIC_KEY", "SOLANA_RECIPIENT_PUBLIC_KEY", "SOLANA_RPC_URL"]) if (process.env[key]) appendFileSync(".env.vultr", "\n" + key + "=" + JSON.stringify(process.env[key]) + "\n");'
          printf 'Host 64.177.46.134\n  BatchMode yes\n  StrictHostKeyChecking yes\n  IdentitiesOnly yes\n' > ~/.ssh/config
      - name: Deploy and verify HTTPS
        run: npm run deploy:vultr -- root@64.177.46.134
      - name: Remove deployment credentials
        if: always()
        run: rm -f .env.vultr ~/.ssh/id_ed25519 ~/.ssh/known_hosts ~/.ssh/config
