name: Verify Tripwire
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
        if: runner.os == 'Linux'
      - run: npm run test:e2e
        if: runner.os == 'Linux'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results-${{ runner.os }}
          path: |
            test-results/**/*.png
            test-results/**/*.zip
            test-results/**/*.md
          retention-days: 7
  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Configure private deployment credentials
        env:
          VULTR_SSH_KEY: ${{ secrets.VULTR_SSH_KEY }}
          VULTR_KNOWN_HOSTS: ${{ secrets.VULTR_KNOWN_HOSTS }}
          VULTR_ENV: ${{ secrets.VULTR_ENV }}
        run: |
          test -n "$VULTR_SSH_KEY"
          test -n "$VULTR_KNOWN_HOSTS"
          test -n "$VULTR_ENV"
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$VULTR_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$VULTR_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$VULTR_ENV" > .env.vultr
          printf 'Host 64.177.46.134\n  BatchMode yes\n  StrictHostKeyChecking yes\n  IdentitiesOnly yes\n' > ~/.ssh/config
      - name: Deploy and verify HTTPS
        run: npm run deploy:vultr -- root@64.177.46.134
      - name: Remove deployment credentials
        if: always()
        run: rm -f .env.vultr ~/.ssh/id_ed25519 ~/.ssh/known_hosts ~/.ssh/config
